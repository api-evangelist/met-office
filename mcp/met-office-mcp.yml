status: candidate
description: No official Met Office MCP server was found (web search 2026-10-18 surfaced only third-party community servers on LobeHub that wrap Weather DataHub with a MET_OFFICE_API_KEY; not provider-published).
  datahub.metoffice.gov.uk answers 200 HTML for every path (SPA catch-all), so /.well-known/mcp.json there is not a real document; www.metoffice.gov.uk/.well-known/mcp.json returned 404. This is a candidate
  tool list derived one-tool-per-operation from the six Weather DataHub OpenAPI contracts.
deployment:
  mode: none
  auth: api-key
  verified: derived
auth:
  type: apiKey
  in: header
  name: apikey
  note: Weather DataHub subscription API key, per every contract securityScheme.
probes:
- url: https://www.metoffice.gov.uk/.well-known/mcp.json
  status: 404
- url: https://datahub.metoffice.gov.uk/.well-known/mcp.json
  status: 200
  note: SPA catch-all HTML, not JSON
