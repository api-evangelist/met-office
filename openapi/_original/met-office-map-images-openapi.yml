openapi: 3.0.1
info:
  title: Map Images
  description: "This API allows you to retrieve orders for Map Images data. The API \n    described here contains a definition\
    \ for all  requests as well as \n    examples of how to create your code to interface with our gateway \n    to retrieve\
    \ your data.\n\n When you call this API you will need your API key and\n    can begin by making a call to /1.0.0/orders\
    \ (this will give you all of your\n    Order IDs).\n\n API Usage is typically done in 4 Steps\n\n 1. Call GET /1.0.0/orders\
    \ - to programmatically get each order \"orderId\"\n    field\n\n 2. Call GET /1.0.0/orders/{orderId}/latest - to get\
    \ a list of \"fileId\"\n    entries (these represent all the files available for this order)\n\n 3. Call GET /1.0.0/orders/{orderId}/latest/{fileId}\
    \ - to get more detailed\n    information about each file if required\n\n 4. Call GET /1.0.0/orders/{orderId}/latest/{fileId}/data\
    \ - to get access \n    to a specific map images PNG file\n\n There is also an endpoint to query the runs available:\n\
    \n 1. Call GET /1.0.0/runs - to get each available run\n\n Using your application, you can go through multiple\n    orders\
    \ and then retrieve the files for each.\n\n Please be aware that the files could be delivered by redirecting your\n  \
    \  client, so your client should follow any HTTP 302 redirects it gets to allow\n    it to download the file. Please note\
    \ the file ID will need to be URL encoded.\n\n This is done in Curl by adding -L or --location (in programming languages,\n\
    \    you will need to visit the new URL to get your file).\n\n If there are any errors or issues, each endpoint will provide\
    \ an appropriate\n    HTTP response and may provide a JSON body providing you with further helpful\n    information, so\
    \ please do not forget to check for errors.\n\n If you are testing before development or downloading using scripts with\
    \ a\n    tool like Curl you can view errors using --verbose. If you do not do this it\n    could just appear that you\
    \ are getting \"nothing back\".\n\n Please read the documentation below to help you develop your solution."
  termsOfService: ''
  contact:
    name: Data Provisioning Team (DPT)
    url: https://www.metoffice.gov.uk/about-us/contact
    email: enquiries@metoffice.gov.uk
  version: 1.1.0
servers:
- url: https://data.hub.api.metoffice.gov.uk/map-images/1.0.0
  description: Base URL stated on the Weather DataHub API documentation page
security:
- APIKey: []
paths:
  /orders:
    get:
      tags: []
      summary: List all orders visible to current user.
      description: This gets an object detailing the active orders that have been configured using the Map Images configuration
        Tool for your  Organisation.
      operationId: getOrders
      parameters:
      - name: Accept
        in: header
        description: application/json required here.
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: All available orders are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrderList'
        '400':
          description: Your request is incorrectly formed so the API is unable to process it. Please check that your URL and
            headers are correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server400'
        '401':
          description: You have not sent any authentication (apikey header) or your authentication details (api key) are incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server401'
        '403':
          description: You sent correct authentication details (api key), but you do not have permissions to access this resource.
            Please check that your Application is subscribed to a plan allowing you access to this API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server403'
        '404':
          description: Resource not found. You have requested a URL that the service does not have, please check you have
            sent a correct URL. When requesting /orders please remember to leave off the trailing forward slash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server404'
        '406':
          description: You requested a resource format that cannot be supplied. For all endpoints, your Accept header should
            contain application/json except when requesting a file with /data when you should send the correct MIME type for
            the file being received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server406'
        '429':
          description: You sent too many requests today and have now been blocked from making any further calls to the service.
            See the Retry-After header or nextAccessTime JSON body field for the time when your block will be lifted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server429'
        '500':
          description: Something went wrong on the server which is not your fault. Please retry your request again. If you
            continue to experience this error then please report the problem to the Met Office Support Teams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server500'
        '503':
          description: The server is temporarily overloaded. Please retry your request again. If you continue to experience
            this error then please report the problem to the Met Office Support Teams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server503'
      deprecated: false
      security:
      - APIKey: []
  /orders/{orderId}/latest:
    get:
      tags: []
      summary: Provide a list of the latest available data files for the specified order.
      description: Provide a list of available files for the order created in the Map Images Data Tool. This contains metadata
        such as fileId, the runs, the region selected and the parameters and time steps selected.
      operationId: getOrderLatest
      parameters:
      - name: orderId
        in: path
        description: The order ID that you wish to retrieve information for. This could be different to your order name as
          entered on the Map Images Data Tool because certain characters are removed from that name. Please ensure you check
          for the API Order ID on the Order Summary page or use the one retrieved from a call to /orders.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: application/json required here.
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: A list of an orders latest available data files is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrderDetails'
        '400':
          description: Your request is incorrectly formed so the API is unable to process it. Please check that your URL and
