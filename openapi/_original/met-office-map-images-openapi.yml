  /orders/{orderId}/latest/{fileId}/data:
    get:
      tags: []
      summary: Gets the actual data for a specific file that can be obtained for the latest available data.
      description: This endpoint provides the binary file data for a given file ID.
      operationId: getOrderLatestFileData
      parameters:
      - name: orderId
        in: path
        description: The order ID that you wish to retrieve files for. The Order ID can be seen under a specific order on
          the Map Images Data Tool Order Summary Page or found in the list of orders in the JSON response from your call to
          /orders
        required: true
        schema:
          type: string
      - name: fileId
        in: path
        description: The file ID of the image/png file you wish to retrieve information about. The file IDs can be seen on
          the Map Images Data Tool Order Summary Page or found in the JSON response from your call to /orders/{orderId}/latest
        required: true
        schema:
          type: string
      - name: includeLand
        in: query
        description: Whether to include and merge and optional land_cover layer that  supports the image with a map base,
          defaults to disabled.
        schema:
          type: boolean
      - name: legend
        in: query
        description: Optionally include a legend in the downloaded map image
        schema:
          type: boolean
      - name: Accept
        in: header
        description: application/x-grib required here to receive the 302. Once the  new location is visited the binary contents
          of the file will be made  available to your application.
        required: true
        example: application/x-grib
        schema:
          type: string
      responses:
        '200':
          description: The Map Images file image as a image/png for the selected  maps layer that is present within the order.
          content: {}
        '400':
          description: Your request is incorrectly formed so the API is unable to process it. Please check that your URL and
            headers are correct.
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/Server400'
        '401':
