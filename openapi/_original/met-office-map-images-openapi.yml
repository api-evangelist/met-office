components:
  schemas:
    ApiAxisExtent:
      title: ApiAxisExtent
      required:
      - label
      - lowerBound
      - uomLabel
      - upperBound
      type: object
      properties:
        label:
          type: string
        lowerBound:
          type: string
        uomLabel:
          type: string
        upperBound:
          type: string
    ApiOrderAxes:
      title: ApiOrderAxes
      required:
      - x
      - y
      type: object
      properties:
        x:
          $ref: '#/components/schemas/ApiAxisExtent'
        y:
          $ref: '#/components/schemas/ApiAxisExtent'
      example:
        x:
          label: longitude
          lowerBound: '-14.0000'
          upperBound: '37.0000'
          uomLabel: degree
        y:
          label: latitude
          lowerBound: '33.0000'
          upperBound: '68.0000'
          uomLabel: degree
    ApiOrderDetails:
      title: ApiOrderDetails
      required:
      - orderDetails
      type: object
      properties:
        orderDetails:
          $ref: '#/components/schemas/ApiOrderDetailsOrderDetails'
    ApiOrderDetailsOrderDetails:
      title: ApiOrderDetailsOrderDetails
      required:
      - files
      - order
      type: object
      properties:
        order:
          $ref: '#/components/schemas/ApiOrderInfoSummary'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ApiOrderFile'
      description: Details of the order and a list of available files
    ApiOrderFile:
      title: ApiOrderFile
      required:
      - fileId
      - parameters
      - run
      - runDateTime
      - timesteps
      type: object
      properties:
        fileId:
          type: string
          description: Identifier for requesting this file
          example: isbl_temperature_100000_+00
        surfaceId:
          type: string
          description: Model specific surface type for parameters within this file
          example: isbl
        levels:
          type: array
          description: An array of levels for which data will be included
          example:
          - '100000'
          items:
            type: string
        runDateTime:
          type: string
          description: Date and time of the model run
          example: '2020-02-19T12:00:00.000Z'
        run:
          type: string
          description: Time of the run within the day
          example: '12'
        region:
          $ref: '#/components/schemas/ApiRegionDetails'
        parameters:
          type: array
          description: Array of one or more parameters that will be included in the file
          example:
          - temperature
          items:
            type: string
        timesteps:
          type: array
          description: Timesteps, relative to run time, for which data will be returned in this file if available
          example:
          - '0'
          - '3'
          - '6'
          - '9'
          - '12'
          - '15'
          - '18'
          - '21'
          - '24'
          items:
            type: string
    ApiOrderFileDetails:
      title: ApiOrderFileDetails
      required:
      - fileDetails
      type: object
      properties:
        fileDetails:
          $ref: '#/components/schemas/ApiOrderFileDetailsFileDetails'
    ApiOrderFileDetailsFileDetails:
      title: ApiOrderFileDetailsFileDetails
      required:
      - file
      - parameterDetails
      type: object
      properties:
        file:
          $ref: '#/components/schemas/ApiOrderFile'
        parameterDetails:
          type: array
          items:
            $ref: '#/components/schemas/ApiParameterDetails'
    ApiOrderInfo:
      title: ApiOrderInfo
      required:
      - format
      - modelId
      - name
      - orderId
      - requiredLatestRuns
      type: object
      properties:
        description:
          type: string
          description: A description of the order
          example: Example CDA order created by Fred
        format:
          type: string
          description: Format of the returned data file
          example: GRIB2
          enum:
          - GRIB2
        modelId:
          type: string
          description: Model used to generate the data
          example: mo-global
        name:
          type: string
          description: Name assigned to the order by the user
          example: my_order
        orderId:
          type: string
          description: order identifier
          example: myorder
        regions:
          type: array
          description: Geographical regions for which data will be included
          items:
            $ref: '#/components/schemas/ApiRegionDetails'
        requiredLatestRuns:
          type: array
          description: List of model run times for which latest data will be available. Only the last run for each time will
            be available.
          example:
          - '00'
          items:
            type: string
        timesteps:
          type: array
          description: Timesteps, relative to run time, for which data will be returned if available
          example:
          - '0'
          - '3'
          - '6'
          - '9'
          - '12'
          - '15'
          - '18'
          - '21'
          - '24'
          items:
            type: string
    ApiOrderInfoSummary:
      title: ApiOrderInfoSummary
      required:
      - format
      - modelId
      - name
      - orderId
      type: object
      properties:
        orderId:
          type: string
          description: order identifier
          example: myorder
        name:
          type: string
          description: Name assigned to the order by the user
          example: my_order
        modelId:
          type: string
          description: Model used to generate the data
          example: mo-global
        format:
          type: string
          description: Format of the returned data file
          example: GRIB2
          enum:
          - GRIB2
    ApiOrderList:
      title: ApiOrderList
      required:
      - orders
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/ApiOrderInfo'
    ApiParameterAxes:
      title: ApiParameterAxes
      required:
      - t
      type: object
      properties:
        t:
          type: array
          items:
            type: string
        z:
          type: array
          items:
            type: number
      example:
        t:
        - '2020-02-19T12:00:00.000Z'
        - '2020-02-19T15:00:00.000Z'
        - '2020-02-19T18:00:00.000Z'
        - '2020-02-19T21:00:00.000Z'
        - '2020-02-20T00:00:00.000Z'
        - '2020-02-20T03:00:00.000Z'
        - '2020-02-20T06:00:00.000Z'
        - '2020-02-20T09:00:00.000Z'
        - '2020-02-20T12:00:00.000Z'
        z:
        - '100000'
    ApiParameterDetails:
      title: ApiParameterDetails
      required:
      - extent
      - parameterId
      type: object
      properties:
        parameterId:
          type: string
          description: Identifies a particular parameter within the model
          example: temperature
        extent:
          $ref: '#/components/schemas/ApiParameterAxes'
    ApiRegionDetails:
      title: ApiRegionDetails
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the region
          example: Europe
        extent:
          $ref: '#/components/schemas/ApiOrderAxes'
    ApiRunList:
      title: ApiRunList
      required:
      - runs
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ApiRunListForModel'
    ApiRunListForModel:
      title: ApiRunListForModel
      required:
      - completeRuns
      - modelId
      type: object
      properties:
        modelId:
          type: string
          description: Model identifier
          example: mo-global
        completeRuns:
          type: array
          items:
            $ref: '#/components/schemas/ApiRunDetails'
    ApiRunDetails:
      title: ApiRunDetails
      required:
      - run
      - runDateTime
      - runFilter
      type: object
      properties:
        run:
          type: string
          description: The hour of the run, 00, 01, etc
          example: '06'
        runDateTime:
          type: string
          description: The actual date and time of the run
          example: '2021-01-25T06:00:00.000Z'
        runFilter:
          type: string
          description: The actual date and time of the run in the runFilter format used by orders API
          example: '2021012506'
    File:
      title: File
      type: object
      properties:
        absolute:
          type: boolean
        absoluteFile:
          $ref: '#/components/schemas/File'
        absolutePath:
          type: string
        canonicalFile:
          $ref: '#/components/schemas/File'
        canonicalPath:
          type: string
        directory:
          type: boolean
        file:
          type: boolean
        freeSpace:
          type: integer
          format: int64
        hidden:
          type: boolean
        name:
          type: string
        parent:
          type: string
        parentFile:
          $ref: '#/components/schemas/File'
        path:
          type: string
        totalSpace:
          type: integer
          format: int64
        usableSpace:
          type: integer
          format: int64
    Server400:
      required:
      - httpCode
      - httpMessage
      - moreInformation
      type: object
      properties:
        httpCode:
          type: string
          example: '400'
        httpMessage:
          type: string
          example: Bad Request
        moreInformation:
          type: string
          example: Your browser sent an invalid request.
    Server401:
      type: object
      properties:
        httpCode:
          type: string
          example: '401'
