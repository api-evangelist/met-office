                $ref: '#/components/schemas/Server500'
        '503':
          description: The server is temporarily overloaded. Please retry your request again. If you continue to experience
            this error then please report the problem to the Met Office Support Teams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server503'
