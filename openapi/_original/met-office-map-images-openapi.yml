  /orders/{orderId}/latest/{fileId}:
    get:
      tags: []
      summary: Provide the details of a specific file that can be obtained for the latest available data.
      description: Provides metadata about a specific fileId. For example you can find out what the file will contain including
        the map layer identifier, the region it covers, the model generation time (run time) and the parameters, time steps
        and level information it contains.
      operationId: getOrderLatestFileDetails
      parameters:
      - name: orderId
        in: path
        description: The order ID that you wish to retrieve information about. The Order ID can be seen under a specific order
          on the Map Images Data Tool Order Summary Page or found in the list of orders in the JSON response from your call
          to /orders
        required: true
        schema:
          type: string
      - name: fileId
        in: path
        description: The file ID of the image/png file you wish to retrieve information about.  The file IDs can be seen on
          the Map Images Data Tool Order Summary Page or  found in the JSON response from your call to /orders/{orderId}/latest
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: application/json required here.
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: Details of a specific file within an order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrderFileDetails'
        '400':
          description: Your request is incorrectly formed so the API is unable to process it. Please check that your URL and
            headers are correct.
          content:
            application/json:
              schema:
