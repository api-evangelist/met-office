  /collections/{collection_name}/instances/{instance_id}/locations/{location_id}:
    get:
      tags:
      - Instance Data
      summary: Location data query
      description: Provides data for the instance id and location id as a CovJson response
      parameters:
      - name: location_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: parameter-name
        in: query
        description: 'A comma delimited list of parameters to filter on. Any parameter names which don''t exist will be ignored.
          If no parameters are specified then all available parameters will be returned.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: datetime
        in: query
        description: 'A datetime filter expression which adheres to one of the following:

          - A single datetime in ISO 8601 format, e.g. 2026-01-01T12:00:00Z

          - A list of individual datetimes separated by commas, e.g. 2026-01-01T12:00:00Z,2026-01-02T12:00:00Z

          - A closed date range, following the format `<start>/<end>`, e.g. 2026-01-01T12:00:00Z/2026-01-02T12:00:00Z

          - An open ended date range, following the format `<start>/..`, e.g. 2026-01-01T12:00:00Z/..

          - An open ended date range, following the format `../<end>`, e.g. ../2026-01-02T12:00:00Z

          - A repeating interval, specified as `R{n}/{start datetime}/{duration}` where `n` is the number of repetitions,
          `start datetime` is the starting datetime in ISO8601 format and `duration` is the duration between each repetition
          in ISO8601 duration format. E.g. `R3/2026-01-01T00:00:00Z/PT6H`.

          In all cases, datetimes must be specified in ISO8601 format.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: instance_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: percentiles
        in: query
        description: 'A comma delimited list of percentiles to filter on. Percentile values must be numeric, and any percentile
          values which don''t exist will be ignored. If no percentiles are specified then all available percentiles will be
          returned.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: collection_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Provides data for the instance id and location id as a CovJson response
          content: {}
        '500':
          description: An unexpected error has occurred within the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - api_key: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /collections/{collection_name}/instances/{instance_id}/position:
    get:
      tags:
