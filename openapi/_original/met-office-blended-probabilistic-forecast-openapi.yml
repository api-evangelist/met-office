openapi: 3.0.1
info:
  title: Met Office Site Specific Blended Probabilistic Forecast
  description: "This service implements an Environmental Data Retrieval (EDR) API for serving improver feature data.\n\n IMPROVER\
    \ is an abbreviation of Integrated Model Post-Processing and Verification. This refers to the new probabilistic post-processing\
    \ weather data system we have developed which drives the output of data for the Met Office Site-Specific Blended Probabilistic\
    \ forecast. \n \n When you call this API, you will need to set your API key.\n\nAPI Usage is typically done in 4 steps:\n\
    \n1.\tCall GET /2.0.0/collections - to retrieve a list of collections along with their metadata, collection name, and\
    \ available endpoints.\n2.\tCall GET /2.0.0/collections/{collection_name}/instances - to retrieve a list of available\
    \ instances for the collection.\n3.\tCall GET /2.0.0/collections/{collection_name}/instances/{instance_id}/locations -\
    \ to retrieve a list of available locations for the collection and instance including their coordinates and location ID.\n\
    4.\tCall GET /2.0.0/collections/{collection_name}/instances/{instance_id}/locations/{location_id} - to fetch weather data\
    \ for the specified location.\n\nAlternatively:\n\n3.\tCall GET /2.0.0/collections/{collection_name}/instances/{instance_id}/position\
    \ - to fetch weather data from the nearest location to a set of coordinates. \n\nFor additional information:\n\n1.\tCall\
    \ GET /2.0.0/ - to retrieve the API definition and metadata.\n2.\tCall GET /2.0.0/conformance - to retrieve a list of\
    \ specifications this API conforms to.\n3.\tCall GET /2.0.0/collections/{collection_name} - to retrieve metadata about\
    \ a specific collection.\n4.\tCall GET /2.0.0/collections/{collection_name}/instances/{instance_id} - to retrieve metadata\
    \ about a specific instance.\n\nIf there are any errors or issues, each endpoint will provide an appropriate HTTP response\
    \ and may provide a JSON body providing you with further helpful information, so please do not forget to check for errors.\n\
    \nIf you are testing before development or downloading using scripts with a tool like Curl you can view errors using --verbose.\
    \ If you do not do this it could just appear that you are getting \"nothing back\".\n\n"
  contact:
    name: Data Provisioning Team (DPT)
    url: https://www.metoffice.gov.uk/about-us/contact
    email: enquiries@metoffice.gov.uk
  version: 2.0.0
