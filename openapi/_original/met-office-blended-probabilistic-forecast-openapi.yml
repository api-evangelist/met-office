        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: collection_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: CovJson response with the nearest feature to the point specified in the query
          content: {}
        '500':
          description: An unexpected error has occurred within the feature service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - api_key: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
