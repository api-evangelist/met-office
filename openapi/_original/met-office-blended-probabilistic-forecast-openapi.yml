      summary: Nearest neighbour query
      description: Provides data for the nearest location as a CovJson response
      parameters:
      - name: parameter-name
        in: query
        description: 'A comma delimited list of parameters to filter on. Any parameter names which don''t exist will be ignored.
          If no parameters are specified then all available parameters will be returned.

