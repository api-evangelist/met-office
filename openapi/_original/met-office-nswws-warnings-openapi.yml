# x-archived-from: met-office-nswws-warnings-openapi.yml
# x-archived-on: 2026-10-18
openapi: 3.0.3
info:
  title: Met Office NSWWS Public API
  description: "1. Make a [request to the Atom Feed endpoint](#get-/objects/feed). This should be part of a regular polling\
    \ process, for example every 1-2 minutes (depending on your throttling limits). Or at least should be the first step to\
    \ get the latest information.\n\n2. Get details about warnings from the Atom Feed response XML. Updated Entries will persist\
    \ in the Atom Feed for 24 hours from the point they are added.\n\n3. Depending on what you want to do, you can either\
    \ get all currently valid warnings or information about a specific change event, using the Atom Feed id from step 2. The\
    \ Atom Feed will contain endpoints for steps 3.1 and 3.2, if they exist. If they don’t exist in the Atom Feed, then those\
    \ endpoints will not exist.\n\n    3.1. Make a [request to get a snapshot](#get-/objects/issued/-uuid-) of all currently\
    \ valid warnings. Checking whether the endpoint is still current (via the Atom Feed) should be done before refreshing\
    \ it. If it’s not there in the Atom Feed, then it has been removed.\n\n    3.2. Make a [request to the warnings](#get-/objects/updated/-uuid-)\
    \ endpoint for that specific warning update. Updated entries will only exist for 24 hours, after which the update is removed\
    \ from the Atom Feed. Regular polling of the Atom Feed (from step 1) should be relied on and the latest state of the warning\
    \ should be stored within your application."
  contact:
    name: Met Office
    url: https://www.metoffice.gov.uk/
    email: dpt@metoffice.gov.uk
  version: v1.1
servers:
- url: https://data.hub.api.metoffice.gov.uk/nswws/v1.1
  description: Base URL stated on the Weather DataHub API documentation page
security:
- APIKey: []
paths:
  /objects/feed:
    get:
      summary: Retrieve the Atom Feed
      description: Retrieves the Atom Feed which provides entries containing newly issued warnings and updates to warnings,
        including cancellations and expirations. The updated entries persist for 24 hours only from the point they are added.
      operationId: objectsFeed
      responses:
        '200':
          description: Status code with the Atom Feed xml content. The entries are ordered chronologically with the most recent
            update listed first and they persist for 24 hours. The xml content will follow the formal Atom Feed Specification
            document. For further information about the Atom Feed specification, see Introduction to Atom
          content:
            application/atom+xml:
              examples:
                Successful response with a recent event:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<feed xmlns=\"http://www.w3.org/2005/Atom\">\n    <title>Met\
                    \ Office Warnings Feed</title>\n    <link rel=\"self\" type=\"application/atom+xml\" href=\"https://<api\
                    \ base path>/v1.1/objects/feed/\"/>\n    <link rel=\"related\" type=\"application/vnd.geo+json\" href=\"\
                    https://<api base path>/v1.1/objects/issued/bad8d9f8-4c22-4840-b3c7-f98042b8c31e/\" title=\"Latest version\
                    \ of all issued warnings\"/>\n    <author>\n        <name>Met Office</name>\n        <uri>https://www.metoffice.gov.uk</uri>\n\
                    \    </author>\n    <id>urn:uuid:bad8d9f8-4c22-4840-b3c7-f98042b8c31e</id>\n    <rights>Crown Copyright\
                    \ © 2026 Met Office</rights>\n    <updated>2026-07-08T10:51:22Z</updated>\n    <entry>\n        <title>Update</title>\n\
                    \        <link rel=\"alternate\" type=\"application/vnd.geo+json\" href=\"https://<api base path>/v1.1/objects/updated/e14e2b30-cfe1-4c53-9169-7b73f0354d1e/\"\
                    \ title=\"Warnings Updated\"/>\n        <id>urn:uuid:e14e2b30-cfe1-4c53-9169-7b73f0354d1e</id>\n     \
                    \   <updated>2026-07-08T10:51:22Z</updated>\n        <summary>Warnings update that can include new warnings\
                    \ and warnings state changes from ISSUED to CANCELLED or EXPIRED.</summary>\n    </entry>\n</feed>"
                Successful response with no events:
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<feed xmlns=\"http://www.w3.org/2005/Atom\">\n  <title>Met\
                    \ Office Warnings Feed</title>\n  <link rel=\"self\" type=\"application/atom+xml\" href=\"https://<api\
                    \ base path>/v1.1/objects/feed/\" />\n  <link rel=\"related\" type=\"application/vnd.geo+json\" href=\"\
                    https://<api base path>/v1.1/objects/issued/f6b54389-c75c-4f23-aa21-88ef3481761a/\" title=\"Latest version\
                    \ of all issued warnings\" />\n  <author>\n    <name>Met Office</name>\n    <uri>https://www.metoffice.gov.uk</uri>\n\
                    \  </author>\n  <id>urn:uuid:3a15ebde-07ea-4d65-902d-e61649bfe3ce</id>\n  <rights>Crown Copyright © 2022\
                    \ Met Office</rights>\n  <updated>2022-06-03T23:00:10Z</updated>\n</feed>"
        '403':
          description: Authentication has failed, is your API key correct?
        '429':
          description: You have made too many requests to the API within a short period of time and rate-limiting has been
            triggered
  /objects/issued/{uuid}:
    get:
      summary: Retrieves a feature collection of latest warnings in a GeoJSON format.
      description: 'For simplicity and accuracy you should use the URL supplied in the response from the /feed endpoint rather
        than composing the URL yourself. The URL pattern above is supplied for reassurance that you have the right link. This
        URL is in the feed section at the head of the Atom Feed document. It is supplied in the link element which has the
        rel attribute related, in the href attribute. There is only ever one value for this link in the whole feed, but the
        URL changes every time the feed is updated. It should be noted that refreshing the URL will not result in any changes,
        it still will be necessary to get the latest from the Atom Feed.


        GeoJSON is an IETF specification for encoding geographic information in JSON. A useful file-viewer is available at
        [http://geojson.io/]. NSWWS warnings GeoJSON makes use of the freedom allowed by the spec to put extra information
        inside the properties section of a GeoJSON feature. The geometry element of a NSWWS warning is always a MultiPolygon.'
      operationId: objectsIssued
      parameters:
      - name: uuid
        in: path
        description: UUID for current latest
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: With the feature collection containing the latest versions of all warnings issued for the next 7 days
            at a point when warnings were last issued. It will be in a GeoJSON format. This collection will not include EXPIRED
            and CANCELLED warnings. Results will be ordered primarily by Risk (Highest risk first) and then chronologically
            by validFromDate date. The risk order looks primarily at warningLevel (RED > AMBER > YELLOW) then by warningImpact
            and finally by warningLikelihood (i.e. the position in the Risk Matrix - see [the guide to the National Severe
            Weather Warnings Service](https://www.metoffice.gov.uk/weather/guides/warnings) for more information).
