  /objects/updated/{uuid}:
    get:
      summary: Retrieves a feature collection of a warning event in a GeoJSON format.
      description: 'For simplicity and accuracy you should use the URL supplied in the response from the /feed endpoint rather
        than composing the URL yourself. The URL pattern above is supplied for reassurance that you have the right link. You
        get this URL from a specific entry section in the Atom Feed document. It is found in the link element which has the
        rel attribute alternate, in the href attribute. There is a different URL for each entry. These updates only exist
        for 24 hours, so a regular polling of the Atom Feed should be relied upon. As well as that, it would be advisable
        to store the state of the warning within your application, in case of no updates or changes to a warning for more
        than 24 hours.


        GeoJSON is an IETF specification for encoding geographic information in JSON. A useful file-viewer is available at
        [http://geojson.io/]. NSWWS warnings GeoJSON makes use of the freedom allowed by the spec to put extra information
        inside the properties section of a GeoJSON feature. The geometry element of a NSWWS warning is always a MultiPolygon.'
      operationId: objectsUpdated
      parameters:
      - name: uuid
        in: path
        description: Atom entry UUID
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'With a feature collection containing the warning that has been updated, whether it is issued, updated,
            expired or cancelled. If the event was an expiry then there may be more than one warning in the feature collection
            as it is possible for two warnings to expire at once.


            Examining warningStatus, and if it exists, warningUpdateDescription we can see there are four possible states
            for a warning as follows:<br>


            <br><table><thead><tr><th>warningStatus</th><th>warningUpdateDescription</th><th>Description</th></tr></thead><tbody><tr><td>ISSUED</td><td>Does
            not exist</td><td>An issued warning</td></tr><tr><td>ISSUED</td><td>Does exist</td><td>An issued warning that
            has been updated with the reasons documented in warningUpdateDescription</td></tr><tr><td>CANCELLED</td><td>Does
            exist</td><td>Warning that has been cancelled with the reasons documented in warningUpdateDescription</td></tr><tr><td>EXPIRED</td><td>Does
