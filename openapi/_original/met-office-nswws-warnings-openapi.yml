                    \ with power cuts when they have prepared for them in advance. It's easy to do; consider gathering torches\
                    \ and batteries, a mobile phone power pack and other essential items. If you find yourself outside and\
                    \ hear thunder, protect yourself by finding a safe enclosed shelter (such as a car). Do not shelter under\
