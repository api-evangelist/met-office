        schema: {}
      - name: latitude
        in: query
        description: The request latitude value in range -85/+85 expressed as a decimal fraction.
        required: true
        schema: {}
      - name: longitude
        in: query
        description: The request longitude value in range -180/+180 expressed as a decimal fraction.
        required: true
        schema: {}
