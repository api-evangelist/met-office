aid: met-office

name: Met Office

description: The Met Office is the United Kingdom's national weather and climate service, providing weather forecasts for the UK and "world leading
  weather services for the public" (metoffice.gov.uk). For developers it publishes Weather DataHub (datahub.metoffice.gov.uk), a subscription
  data service with API documentation for site-specific forecasts, atmospheric model data, map images, land observations and National Severe Weather
  Warning Service warnings, along with the older DataPoint service, RSS feeds and open-source code on GitHub.

